<!DOCTYPE html>
{% load static %}
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/mdb-ui-kit/3.6.0/mdb.min.css" rel="stylesheet" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Roboto:wght@300;400;500;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <title>
        {% block title_block %} BP Lenders | Loan Management System {% endblock %}
    </title>

    <style>
        /* Global foundation for the project */
        :root {
            --primary-dark: #0a1128;
            --accent-orange: #f89500;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--primary-dark);
            /* Sets default for smooth page transitions */
            color: #ffffff;
            margin: 0;
            padding: 0;
        }

        /* Smooth scrolling for better UX */
        html {
            scroll-behavior: smooth;
        }
    </style>

    {% block css_block %}{% endblock %}
</head>

<body>

    {% block body_block %}
    {% endblock %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
    <script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/mdb-ui-kit/3.6.0/mdb.min.js"></script>

    {% block block_js %}{% endblock %}
</body>

</html>
