{% extends "admin/base_site.html" %}
{% block content %}
<div style="max-width: 450px; margin: 50px auto; padding: 30px; background: #fff; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); border: 1px solid #ddd;">
    <h2 style="color: #333; text-align: center;">Identity Verification</h2>
    <p style="text-align: center; color: #666;">Adding a new <strong>Loan Category</strong> requires superuser confirmation.</p>
    
    <form method="post" style="margin-top: 25px;">
        {% csrf_token %}
        <div style="margin-bottom: 20px;">
            <input type="password" name="password" placeholder="Enter Superuser Password" required 
                   style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 4px; font-size: 16px;">
        </div>
        <button type="submit" style="width: 100%; padding: 12px; background: #28a745; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer;">
            Confirm and Save
        </button>
        <div style="margin-top: 15px; text-align: center;">
            <a href="{% url 'admin:loanApp_loancategory_changelist' %}" style="color: #999; text-decoration: none; font-size: 14px;">Cancel Action</a>
        </div>
    </form>
</div>
{% endblock %}
